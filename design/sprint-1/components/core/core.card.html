<script type="text/babel">const { Button, Badge, Input, Select, Card, CardHeader, CardContent, Icon } = window.SalesIntelligenceDesignSystem_3dfbfd;

function Demo(){return <div style={{display:'grid',gap:18}}>

    <Button icon={<Icon name="Plus"/>}>New opportunity</Button>
    <Button variant="secondary">Secondary</Button>
    <Button variant="outline" icon={<Icon name="Download"/>}>Export</Button>
    <Button variant="ghost">Ghost</Button>
    <Button variant="danger">Delete</Button>
    <Button disabled>Disabled</Button>
    <Button size="icon" aria-label="Next"><Icon name="ChevronRight"/></Button>
    <Button size="sm" variant="outline">Small</Button>

  <Row label="Badges">

    <Badge tone="positive">Billed</Badge><Badge tone="warning">Low margin</Badge>

    <Card><CardHeader title="Priority risks" subtitle="Deterministic signals" action={<a href="#risks">View all</a>}/><CardContent><Input icon={<Icon name="Search"/>} borderless placeholder="Search opportunities…"/></CardContent></Card>
