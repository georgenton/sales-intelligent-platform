<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces & text — light" subtitle="Canvas, card, sunken, inverse; text and border pairs" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-primary)}.lab{font-size:var(--text-10);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600}.mono{font-family:var(--font-mono);font-size:var(--text-10);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px"><div><div style="height:56px;border-radius:8px;background:var(--bg-canvas);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--text-primary);font-size:var(--text-10);font-weight:600">canvas</div><div class="mono" style="margin-top:5px">--bg-canvas</div></div><div><div style="height:56px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--text-primary);font-size:var(--text-10);font-weight:600">surface</div><div class="mono" style="margin-top:5px">--surface</div></div><div><div style="height:56px;border-radius:8px;background:var(--surface-sunken);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--text-primary);font-size:var(--text-10);font-weight:600">sunken</div><div class="mono" style="margin-top:5px">--surface-sunken</div></div><div><div style="height:56px;border-radius:8px;background:var(--surface-inverse);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">inverse</div><div class="mono" style="margin-top:5px">--surface-inverse</div></div><div><div style="height:56px;border-radius:8px;background:var(--surface-inverse-2);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">inverse 2</div><div class="mono" style="margin-top:5px">--surface-inverse-2</div></div><div><div style="height:56px;border-radius:8px;background:var(--border);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--text-primary);font-size:var(--text-10);font-weight:600">border</div><div class="mono" style="margin-top:5px">--border</div></div><div><div style="height:56px;border-radius:8px;background:var(--text-muted);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">text muted</div><div class="mono" style="margin-top:5px">--text-muted</div></div></div></body></html>
