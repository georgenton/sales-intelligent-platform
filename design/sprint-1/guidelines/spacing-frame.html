<div style="display:grid;grid-template-rows:34px 1fr"><div style="border-bottom:1px solid var(--border);background:var(--surface);color:var(--text-muted);padding:9px 10px">header <b>64px</b></div><div style="background:var(--bg-canvas);color:var(--text-muted);padding:10px">content · max <b>1600px</b> · pad 20 / 32</div></div>
