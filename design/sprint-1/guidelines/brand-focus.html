<!-- @dsCard group="Brand" viewport="700x170" name="Interaction states" subtitle="Hover darkens, press deepens, focus is a 2px ring — never a scale change" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-primary)}.lab{font-size:var(--text-10);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600}.mono{font-family:var(--font-mono);font-size:var(--text-10);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
<div><div style="height:40px;padding:0 16px;display:grid;place-items:center;border-radius:8px;background:var(--brand);color:var(--text-on-brand);font-size:14px;font-weight:600;">New opportunity</div><div class="mono" style="margin-top:6px">default</div></div><div><div style="height:40px;padding:0 16px;display:grid;place-items:center;border-radius:8px;background:var(--brand-hover);color:var(--text-on-brand);font-size:14px;font-weight:600;">New opportunity</div><div class="mono" style="margin-top:6px">hover</div></div><div><div style="height:40px;padding:0 16px;display:grid;place-items:center;border-radius:8px;background:var(--brand-active);color:var(--text-on-brand);font-size:14px;font-weight:600;">New opportunity</div><div class="mono" style="margin-top:6px">pressed</div></div><div><div style="height:40px;padding:0 16px;display:grid;place-items:center;border-radius:8px;background:var(--brand);color:var(--text-on-brand);font-size:14px;font-weight:600;outline:2px solid var(--focus-ring);outline-offset:2px">New opportunity</div><div class="mono" style="margin-top:6px">focus</div></div><div><div style="height:40px;padding:0 16px;display:grid;place-items:center;border-radius:8px;background:var(--brand);color:var(--text-on-brand);font-size:14px;font-weight:600;opacity:.5">New opportunity</div><div class="mono" style="margin-top:6px">disabled</div></div>
</div></body></html>
