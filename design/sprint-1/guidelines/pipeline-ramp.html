<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-primary)}.lab{font-size:var(--text-10);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600}.mono{font-family:var(--font-mono);font-size:var(--text-10);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"><div><div style="height:52px;border-radius:8px;background:var(--pipeline-discovery);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">discovery</div><div class="mono" style="margin-top:5px">--pipeline-discovery</div></div><div><div style="height:52px;border-radius:8px;background:var(--pipeline-qualified);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">qualified</div><div class="mono" style="margin-top:5px">--pipeline-qualified</div></div><div><div style="height:52px;border-radius:8px;background:var(--pipeline-proposal);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">proposal</div><div class="mono" style="margin-top:5px">--pipeline-proposal</div></div><div><div style="height:52px;border-radius:8px;background:var(--pipeline-commit);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">commit</div><div class="mono" style="margin-top:5px">--pipeline-commit</div></div><div><div style="height:52px;border-radius:8px;background:var(--pipeline-backlog);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">backlog</div><div class="mono" style="margin-top:5px">--pipeline- <p style="margin:12px 0 0;font:var(--type-meta);color:var(--text-muted)">Tenant stage ladder: 0 Identified · 25 Discovery · 50 Proposal · 75 Commit · 90 Closed won pending billing · 100 Billed.</p></body></html>
