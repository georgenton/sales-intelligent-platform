<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-primary)}.lab{font-size:var(--text-10);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600}.mono{font-family:var(--font-mono);font-size:var(--text-10);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"><div><div style="height:46px;border-radius:8px;background:var(--pipeline-discovery-soft);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--text-primary);font-size:var(--text-10);font-weight:600">discovery</div><div class="mono" style="margin-top:5px">--pipeline-discovery-soft</div></div><div><div style="height:46px;border-radius:8px;background:var(--pipeline-qualified-soft);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--text-primary);font-size:var(--text-10);font-weight:600">qualified</div><div class="mono" style="margin-top:5px">--pipeline-qualified-soft</div></div><div><div style="height:46px;border-radius:8px;background:var(--pipeline-proposal-soft);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--text-primary);font-size:var(--text-10);font-weight:600">proposal</div><div class="mono" style="margin-top:5px">--pipeline-proposal-soft</div></div><div><div style="height:46px;border-radius:8px;background:var(--pipeline-commit-soft);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--text-primary);font-size:var(--text-10);font-weight:600">commit</div><div class="mono" style="margin-top:5px">--pipeline-commit-soft</div></div><div><div style="height:46px;border-radius:8px;background:var(--pipeline-backlog-soft);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--t
