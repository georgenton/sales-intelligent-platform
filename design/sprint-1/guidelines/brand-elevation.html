<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-primary)}.lab{font-size:var(--text-10);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600}.mono{font-family:var(--font-mono);font-size:var(--text-10);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:14px"><div style="flex:1"><div style="height:74px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-card)"></div><div class="mono" style="margin-top:8px">--shadow-card</div></div><div style="flex:1"><div style="height:74px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-raised)"></div><div class="mono" style="margin-top:8px">--shadow-raised</div></div><div style="flex:1"><div style="height:74px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-overlay)"></div><div class="mono" style="margin-top:8px">--shadow-overlay</div></div></div></body></html>
