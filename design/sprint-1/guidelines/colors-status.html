<!-- @dsCard group="Colors" viewport="700x150" name="Status semantics" subtitle="success · warning · danger · critical, with their soft fills" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-primary)}.lab{font-size:var(--text-10);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600}.mono{font-family:var(--font-mono);font-size:var(--text-10);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px"><div><div style="height:56px;border-radius:8px;background:var(--success);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">success</div><div class="mono" style="margin-top:5px">--success</div></div><div><div style="height:56px;border-radius:8px;background:var(--warning);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#3a2a00;font-size:var(--text-10);font-weight:600">warning</div><div class="mono" style="margin-top:5px">--warning</div></div><div><div style="height:56px;border-radius:8px;background:var(--danger);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">danger</div><div class="mono" style="margin-top:5px">--danger</div></div><div><div style="height:56px;border-radius:8px;background:var(--critical);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">critical</div><div class="mono" style="margin-top:5px">--critical</div></div><div><div style="height:56px;border-radius:8px;background:var(--info);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#08242c;font-size:var(--text-10);font-weight:600">info</div><div class="mono" style="margin-top:5px">--info</div></div><div><div style="height:56px;border-radius:8px;background:var(--success-soft);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--success);font-size:var(--text-10);font-weight:600">success soft</div><div class="mono" style="margin-top:5px">--success-soft</div></div><div><div style="height:56px;border-radius:8px;background:var(--danger-soft);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:var(--danger);font-size:var(--text-10);font-weight:600">danger soft</div><div class="mono" style="margin-top:5px">--danger-soft</div></div></div></body></html>
