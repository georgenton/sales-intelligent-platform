<!-- @dsCard group="Colors" viewport="700x170" name="Sales semantics" subtitle="Meaning-first aliases — never reference status hues directly" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-primary)}.lab{font-size:var(--text-10);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600}.mono{font-family:var(--font-mono);font-size:var(--text-10);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div><div style="height:48px;border-radius:8px;background:var(--sales-positive);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">sales-positive</div><div class="mono" style="margin-top:5px">--sales-positive</div></div><div><div style="height:48px;border-radius:8px;background:var(--sales-risk);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">sales-risk</div><div class="mono" style="margin-top:5px">--sales-risk</div></div><div><div style="height:48px;border-radius:8px;background:var(--sales-warning);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#3a2a00;font-size:var(--text-10);font-weight:600">sales-warning</div><div class="mono" style="margin-top:5px">--sales-warning</div></div><div><div style="height:48px;border-radius:8px;background:var(--sales-neutral);border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:var(--text-10);font-weight:600">sales-neutral</div><div class="mono" style="margin-top:5px">--sales-neutral</div></div></div>
<p style="margin:12px 0 0;font:var(--type-meta);color:var(--text-muted)">Colour never carries meaning alone: every risk state also shows an icon and a word.</p></body></html>
