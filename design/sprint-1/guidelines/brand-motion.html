<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-canvas);font-family:var(--font-sans);color:var(--text-primary)}.lab{font-size:var(--text-10);color:var(--text-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;font-weight:600}.mono{font-family:var(--font-mono);font-size:var(--text-10);color:var(--text-muted)}div.bar{height:10px;border-radius:999px;background:var(--brand)}</style></head><body><div style="display:grid;gap:12px">
<div><div class="lab">--dur-fast 140ms · var(--ease-standard)</div><div style="margin-top:5px;height:10px;border-radius:999px;background:var(--surface-sunken)"><div class="bar" style="width:62%"></div></div></div><div><div class="lab">--dur-base 200ms · var(--ease-standard)</div><div style="margin-top:5px;height:10px;border-radius:999px;background:var(--surface-sunken)"><div class="bar" style="width:78%"></div></div></div><div><div class="lab">--dur-slow 280ms · var(--ease-out)</div><div style="margin-top:5px;height:10px;border-radius:999px;background:var(--surface-sunken)"><div class="bar" style="width:94%"></div></div></div>
<p style="margin:0;font:var(--type-meta);color:var(--text-muted)">Reduced motion collapses every duration to 0ms.</p></div></body></html>
