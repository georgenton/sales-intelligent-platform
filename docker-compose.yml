services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - '${POSTGRES_PORT:-5449}:5432'
    volumes:
      - sales_intelligence_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sales_intelligence}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  sales_intelligence_postgres:
