name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: sales_intelligence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/sales_intelligence?schema=public
      MIGRATION_DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/sales_intelligence?schema=public
      RUNTIME_DATABASE_USER: sip_runtime_ci
      RUNTIME_DATABASE_PASSWORD: ci_runtime_role_password_2026_only
      APP_URL: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      DEMO_ADMIN_PASSWORD: ChangeMe-Local-2026!
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm db:provision:runtime
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://sip_runtime_ci:ci_runtime_role_password_2026_only@localhost:5432/sales_intelligence?schema=public
      - run: pnpm test:tenant-isolation
      - run: pnpm build
      - run: pnpm audit --audit-level high

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
